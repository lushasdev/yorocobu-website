[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── Redirects from the previous site ─────────────────────────────────────────
# The old routes were client-side only, but inbound links to them exist. They are
# permanent moves onto the corresponding sections of the full index.

[[redirects]]
  from = "/tech-portfolio"
  to = "/full-index#stack"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/full-index#contact"
  status = 301
  force = true

# The escape hatch has an obvious alias worth honouring.
[[redirects]]
  from = "/index"
  to = "/full-index"
  status = 301
  force = true

# ── Headers ──────────────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
