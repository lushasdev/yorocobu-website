[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── Redirects from the previous site ─────────────────────────────────────────
# The old routes were client-side only, but inbound links to them exist. They are
# permanent moves onto the corresponding sections of the full index.

[[redirects]]
  from = "/tech-portfolio"
  to = "/full-index#stack"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/full-index#contact"
  status = 301
  force = true

# The escape hatch has an obvious alias worth honouring.
[[redirects]]
  from = "/index"
  to = "/full-index"
  status = 301
  force = true

# ── Headers ──────────────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- csp:begin (generated by scripts/build-csp.mjs) ---
# Report-only for now: it produces the evidence for enforcing later without
# risking a live break. Regenerate with `node scripts/build-csp.mjs`.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'sha256-0YQgCPR3fs2xre3+ZeNnG3VYSstAzlF/gkXisEfA1pw=' 'sha256-0jbwcayNLDAnt7AJugah1ODKogLpfFaV0glgeyQDByE=' 'sha256-4de00wd9tgN0F+GO755ZN7h32bkpNWYOHKCtdwoc8Ps=' 'sha256-J7lSgAMJn1BC2BDXYOQ+yAz0JF/G8U8vReFs0FvzAIc=' 'sha256-QzWFZi+FLIx23tnm9SBU4aEgx4x8DsuASP07mfqol/c=' 'sha256-Ya0pUYrC7nM5Cn/056TyVuEiz6dFGrzmkWzgON0pF0U='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
    Cross-Origin-Opener-Policy = "same-origin"
# --- csp:end ---

# ── Edge functions ───────────────────────────────────────────────────────────
# Language detection runs before the page is served, so a Japanese visitor never
# sees a frame of English. See netlify/edge-functions/locale.js for what this
# does and does not detect.
[[edge_functions]]
  function = "locale"
  path = "/"

[[edge_functions]]
  function = "locale"
  path = "/full-index"
